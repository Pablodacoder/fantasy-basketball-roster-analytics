<tr id="list-{{player.id}}">
  <form method="POST" action="{% url 'update' player.id %}">
    {% csrf_token %}
    <td>{{player.full_name}}</td> 
    <td>{{player.team}}</td>
    <td>{{player.position}}</td>
    <td>{{player.recruited}}</td>
    <td><button type="submit">
      add
    </button></td>
  </form>
</tr>
