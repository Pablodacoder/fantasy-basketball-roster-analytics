<div draggable="true">
  <tr id="list-{{player.id}}">
    <form method="POST" action="{% url 'update' player.player_id %}">
      {% csrf_token %}
      <td>{{player.name}}</td> 
      <td>{{player.team}}</td>
      <td>{{player.positions}}</td>
      <td>{{player.recruited}}</td>
      <td>{{player.manager_name}}</td>
      <input type="hidden" name="form_player" value={{player.player_id}} type="number">
      <input type="hidden" name="form_manager" value={{manager.id}} type="number">
      <td>
        {% if player.recruited %}
          <button type="submit" name="action" value={{"remove"}}>Remove</button>
        {% else %}
          <button type="submit" name="action" value={{"add"}}>Add</button>
        {% endif %}
      </td>
    </form>
  </tr>
</div>
