{% comment %}
Put this line in head 
{% include "nav_bar.html" with page=request.resolver_match.url_name %}
{% endcomment %}
<div class="banner">
  <div class="name"><h1>NBA TRADE EVALUATOR</h1></div>
  <nav class="nav-tabs">
    <a class="nav-link {% if page == 'home' %}active{% endif %}" 
      href="{% url 'home' %}">Home</a>
    <a class="nav-link {% if page == 'Search' %}active{% endif %}" 
      href="{% url 'search' %}">Search</a>
    <a class="nav-link {% if page == 'trade' %}active{% endif %}" 
      href="{% url 'trade' %}">Trade</a>
    <a class="nav-link {% if page == 'roster' or page == 'roster_select' %}active{% endif %}" 
      href="{% url 'roster_select' %}">My Roster</a>
  </nav>
</div>
