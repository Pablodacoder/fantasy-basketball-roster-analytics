name: refresh-data

on:
  workflow_dispatch:   # NBA.com blocks GitHub's servers, so this only runs by hand
  
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pull NBA data
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          INJURY_SOURCE: espn
        run: python manage.py refresh_data